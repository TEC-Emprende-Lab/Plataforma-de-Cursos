name: Security Scan (SCA & Secrets)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:

  trivy:
    name: Trivy Dependency Scan (SCA)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-dependency-scan'


  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        id: trufflehog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11
        with:
          extra_args: --only-verified --json > trufflehog-results.json
        continue-on-error: true

      - name: Convert TruffleHog results to SARIF
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json

          input_file = "trufflehog-results.json"
          output_file = "trufflehog-results.sarif"

          results = []

          try:
              with open(input_file, "r") as f:
                  for line in f:
                      line = line.strip()

                      if not line:
                          continue

                      finding = json.loads(line)

                      source_metadata = finding.get("SourceMetadata", {})
                      data = source_metadata.get("Data", {})
                      filesystem = data.get("Filesystem", {})

                      file_path = filesystem.get("file", "")
                      line_number = filesystem.get("line", 1)

                      detector = finding.get("DetectorName", "Secret")
                      raw = finding.get("Raw", "")

                      results.append({
                          "ruleId": detector,
                          "level": "error",
                          "message": {
                              "text": f"Verified secret detected by TruffleHog: {detector}"
                          },
                          "locations": [{
                              "physicalLocation": {
                                  "artifactLocation": {
                                      "uri": file_path
                                  },
                                  "region": {
                                      "startLine": line_number
                                  }
                              }
                          }]
                      })

          except FileNotFoundError:
              pass

          sarif = {
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "TruffleHog",
                          "informationUri": "https://github.com/trufflesecurity/trufflehog"
                      }
                  },
                  "results": results
              }]
          }

          with open(output_file, "w") as f:
              json.dump(sarif, f, indent=2)
          PY

      - name: Upload TruffleHog SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b
        with:
          sarif_file: 'trufflehog-results.sarif'
          category: 'trufflehog-secret-scan'

      - name: Fail job if verified secrets were found
        if: steps.trufflehog.outcome == 'failure'
        run: |
          echo "TruffleHog found verified secrets."
          echo "See the Security tab for details."
          exit 1