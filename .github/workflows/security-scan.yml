name: Security Scan (SCA & Secrets)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write   # required to upload SARIF to the Security tab

jobs:
  trivy:
    name: Trivy Dependency Scan (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true   # don't fail builds on CVEs with no available fix yet
          exit-code: '0'  # always exit 0 so we can upload the SARIF report to the Security tab         

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-dependency-scan'

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0   # full history needed so TruffleHog can walk past commits

      - name: Run TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11
        with:
          extra_args: --only-verified
        # --only-verified means TruffleHog actively checks each candidate secret against
        # the provider's API (e.g. is this AWS key still active?) before reporting it.
        # This keeps the signal-to-noise ratio high — every hit here is a live credential.
