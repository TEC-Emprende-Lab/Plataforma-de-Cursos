name: Lint & Static Analysis

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write   # required to upload SARIF to the Security tab

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (JSON report, always saved)
        run: npx eslint . --format json --output-file eslint-report.json
        continue-on-error: true

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 14

      - name: Run ESLint (fails the job on lint errors)
        run: npx eslint .

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    needs: eslint
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep scan
        id: semgrep
        # --config auto picks rulesets based on detected languages (JS/TS here).
        # Swap to explicit registry configs (e.g. p/javascript p/typescript p/owasp-top-ten)
        # if you want reproducible rule sets instead of "auto".
        run: semgrep scan --config auto --sarif --output semgrep-results.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif

      - name: Fail job if Semgrep found blocking issues
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "Semgrep found blocking findings — see the Security tab or the annotated diff on this PR."
          exit 1