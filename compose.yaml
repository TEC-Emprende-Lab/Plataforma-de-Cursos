name: plataforma-cursos

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plataforma_cursos}
      POSTGRES_USER: ${POSTGRES_USER:-plataforma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_este_password}
    ports:
      # Solo accesible desde el equipo local, nunca desde la red.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # local-development por defecto; para paridad Coolify usar
      # APP_ENV=production y cargar los secretos reales.
      APP_ENV: ${APP_ENV:-development}
      AUTH_MODE: ${AUTH_MODE:-disabled}
      PORT: ${PORT:-5050}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-10485760}
      MAX_SVG_BYTES: ${MAX_SVG_BYTES:-5242880}
      MAX_CSV_BYTES: ${MAX_CSV_BYTES:-1048576}
      MAX_BATCH_ROWS: ${MAX_BATCH_ROWS:-200}
      MAX_CEDULAS: ${MAX_CEDULAS:-200}
      DATABASE_URL: ${DATABASE_URL:-postgresql://plataforma:cambiar_este_password@postgres:5432/plataforma_cursos}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:5050:5050"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CERT_API_URL: ${VITE_CERT_API_URL:-http://localhost:5050}
        VITE_STORAGE_MODE: ${VITE_STORAGE_MODE:-supabase}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_DIAGNOSTICO_API_URL: ${VITE_DIAGNOSTICO_API_URL:-https://diagnostico-emprendimiento.vercel.app}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres_data:
  redis_data:
